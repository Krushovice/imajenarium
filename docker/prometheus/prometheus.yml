global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: book-imaginarium
    env: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: nginx
    static_configs:
      - targets: ["nginx:9113"]
    scrape_interval: 30s
