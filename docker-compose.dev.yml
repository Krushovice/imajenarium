# Dev overrides — run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      target: development
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DEBUG: "true"
      ENVIRONMENT: development

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:8000

  nginx:
    ports:
      - "8080:80"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "0.0.0.0:3001:3000"

volumes:
  hf_cache:
